# Tracks provin.oss's default branch: run both runtimes against oss HEAD
# instead of the pinned revision.
#
# Direction matters, and so does authority. This is the harness watching the
# product — an early signal only. A red run here does NOT mean oss is broken
# and does NOT mean this repository is broken; it means the pair has drifted,
# and the catch-up work could be on either side. The pin in pins.env remains
# what the regular gate runs against until a bump is deliberately committed
# with evidence (see pins.env). Deciding which side moves is a human call.
#
# The same shape provin.oss's spec-crosscheck.yml uses for the dPLaaX spec:
# in-tree pin gates, HEAD-watching informs.
#
# Actions here are pinned to commit SHAs. The original reason was that these
# steps handled a GitHub App private key, which no longer passes through them —
# provin-line/oss went public on 2026-07-27 and the checkout is anonymous now.
# The pins stay because unpinning is a regression regardless of that reason: a
# tag is mutable, and this job runs unattended on a schedule.
#
# Not on pull_request or push on purpose. A job whose redness is ambiguous must
# never block a merge, or its ambiguity gets resolved by whoever is in a hurry.
name: oss-crosscheck

on:
  schedule:
    # Offset from provin.oss's own spec-crosscheck (17 21 * * *) so a drift
    # cascade shows up as two distinct signals rather than one pile.
    - cron: '41 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No credential: provin-line/oss is public, so an anonymous checkout
      # reaches it.
      - name: checkout oss at its default branch HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: provin-line/oss
          path: repos/oss
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Deliberately NOT `make verify-pin`: testing HEAD is the whole point, so
      # the checkout is expected to differ from the pin. Report the pair being
      # tested instead, since that is what a reader of a red run needs first.
      - name: report the pair under test
        run: |
          echo "pinned oss (what the gate uses): $(sed -n 's/^OSS_REF=//p' pins.env)"
          echo "oss HEAD (what this run tests):  $(git -C repos/oss rev-parse HEAD)"
          echo "e2e revision:                    $(git rev-parse HEAD)"
      - run: make test
      - run: make docker-build
      - run: make test-compose

      # Only now, with the pair proven green, is it safe to say the counterpart
      # pin should move. provin.oss gates its own commits against a pinned
      # revision of THIS repo, and nothing over there notices when that pin
      # falls behind — a harness fix can merge here and the gate keeps testing
      # the version before it, silently and greenly. That is not hypothetical:
      # it happened the day the gate was built, and a human spotted it only
      # because an audit went looking.
      #
      # This runs last on purpose. It speaks only when the bump is already
      # known safe, so it can never nag toward a red pairing, and it fails
      # rather than warns because a warning in a scheduled job is a warning
      # nobody reads.
      - name: is provin.oss's pin behind this revision?
        run: |
          pinned=$(sed -n 's/^  E2E_REF: *//p' repos/oss/.github/workflows/e2e.yml)
          current=$(git rev-parse HEAD)
          if [ -z "$pinned" ]; then
            echo "could not read E2E_REF from repos/oss/.github/workflows/e2e.yml"
            exit 1
          fi
          if [ "$pinned" = "$current" ]; then
            echo "provin.oss pins $pinned — current."
            exit 0
          fi
          echo "provin.oss pins   $pinned"
          echo "this revision is  $current"
          echo
          echo "The suites above just passed against oss HEAD at this revision, so the"
          echo "bump is safe. Set E2E_REF to $current in provin.oss's"
          echo ".github/workflows/e2e.yml — until then its gate tests an older harness."
          exit 1
