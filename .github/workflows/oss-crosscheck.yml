# Tracks provin.oss's default branch: run both runtimes against oss HEAD
# instead of the pinned revision.
#
# Direction matters, and so does authority. This is the harness watching the
# product — an early signal only. A red run here does NOT mean oss is broken
# and does NOT mean this repository is broken; it means the pair has drifted,
# and the catch-up work could be on either side. The pin in pins.env remains
# what the regular gate runs against until a bump is deliberately committed
# with evidence (see pins.env). Deciding which side moves is a human call.
#
# The same shape provin.oss's spec-crosscheck.yml uses for the dPLaaX spec:
# in-tree pin gates, HEAD-watching informs.
#
# One pair run, two consumers. A green run here proves BOTH pins can move: this
# repository's OSS_REF to the oss revision just tested, and provin.oss's
# E2E_REF to the harness revision just tested. Neither bump happens here —
# oss-pin-bump.yml fires on this workflow's completion and acts on the first;
# provin.oss's e2e-pin-bump.yml reads this workflow's run conclusion nightly
# and acts on the second. The split is load-bearing: both consumers treat this
# run's conclusion as "did the pair work", so nothing else may contribute to
# it. A bookkeeping step used to, and the eight consecutive red nights it
# produced are recorded in oss-pin-bump.yml.
#
# The pair artifact below is the contractual channel for "which oss revision
# did this run actually test". oss-pin-bump.yml must not re-derive it from the
# API: oss HEAD moves, and a pin bumped to a revision this run never tested
# would carry evidence for a different pairing than the one it names.
#
# Actions here are pinned to commit SHAs. The original reason was that these
# steps handled a GitHub App private key, which no longer passes through them —
# provin-line/oss went public on 2026-07-27 and the checkout is anonymous now.
# The pins stay because unpinning is a regression regardless of that reason: a
# tag is mutable, and this job runs unattended on a schedule.
#
# Not on pull_request or push on purpose. A job whose redness is ambiguous must
# never block a merge, or its ambiguity gets resolved by whoever is in a hurry.
name: oss-crosscheck

on:
  schedule:
    # Offset from provin.oss's own spec-crosscheck (17 21 * * *) so a drift
    # cascade shows up as two distinct signals rather than one pile.
    - cron: '41 22 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # No credential: provin-line/oss is public, so an anonymous checkout
      # reaches it.
      - name: checkout oss at its default branch HEAD
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: provin-line/oss
          path: repos/oss
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      # Deliberately NOT `make verify-pin`: testing HEAD is the whole point, so
      # the checkout is expected to differ from the pin. Report the pair being
      # tested instead, since that is what a reader of a red run needs first.
      - name: report the pair under test
        run: |
          mkdir -p "$RUNNER_TEMP/pair"
          git -C repos/oss rev-parse HEAD > "$RUNNER_TEMP/pair/oss_sha"
          echo "pinned oss (what the gate uses): $(sed -n 's/^OSS_REF=//p' pins.env | head -1)"
          echo "oss HEAD (what this run tests):  $(cat "$RUNNER_TEMP/pair/oss_sha")"
          echo "e2e revision:                    $(git rev-parse HEAD)"
      # Uploaded before the suites run, deliberately: the artifact states which
      # pair was TESTED, not which pair passed — pass/fail is the run's
      # conclusion, and oss-pin-bump.yml reads both. Uploading first also means
      # a red run still records what it was red against.
      - name: record the pair for oss-pin-bump
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pair
          path: ${{ runner.temp }}/pair/
          retention-days: 7
      - run: make test
      - run: make docker-build
      - run: make test-compose
