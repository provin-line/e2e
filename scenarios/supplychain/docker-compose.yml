# Scenario supplychain — compose-runtime topology (the twin of
# supplychain_test.go's process runtime: one broker, one PDP stub, THREE nodes
# — manufacturer source, distributor relay, retailer sink — each hosting its
# own registry, with four NATS accounts and both cross-org grants provisioned
# BEFORE broker boot).
#
# Provisioning artifacts under ./testdata are generated by the test itself
# (E2E_RUNTIME=compose go test ./scenarios/supplychain/); images come from
# `make docker-build`.

services:
  nats:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222"
      - "8222"
    volumes:
      - ./testdata/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./testdata/nats/operator.jwt:/etc/nats/operator.jwt:ro

  pdpstub:
    image: provin-line/pdpstub:local
    # Reached only by nodes over the compose network; no published port.

  mfg:
    image: provin-line/standalone:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/mfg/config:/app/config:ro
      - ./testdata/manufacturer-account.seed:/app/secrets/manufacturer-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    depends_on:
      - nats
      - pdpstub

  dist:
    image: provin-line/standalone:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/dist/config:/app/config:ro
      - ./testdata/distributor-account.seed:/app/secrets/distributor-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    depends_on:
      - nats
      - pdpstub
      - mfg

  retail:
    image: provin-line/standalone:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/retail/config:/app/config:ro
      - ./testdata/retailer-account.seed:/app/secrets/retailer-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    depends_on:
      - nats
      - pdpstub
      - dist
