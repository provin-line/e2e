# Scenario supplychain — compose-runtime topology (the twin of
# supplychain_test.go's process runtime: one broker, one PDP stub, THREE
# organizations — manufacturer source, distributor relay, retailer sink —
# each hosting its own registry, with four NATS accounts and both cross-org
# grants provisioned BEFORE broker boot).
#
# A3: each org's node is split into its own cmd/network (control plane) +
# cmd/pipeline (data plane) service pair — SIX node services in all —
# mirroring the process runtime's own per-org separated topology exactly
# (SplitNodeConfig, harness.ExternalKeys; AGENTS.md rule 3 — both runtimes
# describe the same node/config layout). Cross-org DID/VC resolution uses
# each org's OWN -network service DNS name (registry-base-urls), never a
# -pipeline service's — cmd/pipeline carries no in-process registry
# (wiring.go's package doc) and is never a resolution target.
#
# Provisioning artifacts under ./testdata are generated by the test itself
# (E2E_RUNTIME=compose go test ./scenarios/supplychain/) via
# harness.ProvisionCompose + harness.SplitNodeConfig; images come from
# `make docker-build`.

services:
  nats:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222"
      - "8222"
    volumes:
      - ./testdata/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./testdata/nats/operator.jwt:/etc/nats/operator.jwt:ro

  pdpstub:
    image: provin-line/pdpstub:local
    # Reached only by nodes over the compose network; no published port.

  mfg-network:
    image: provin-line/network:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/mfg-network/config:/app/config:ro
      - ./testdata/manufacturer-account.seed:/app/secrets/manufacturer-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      - nats
      - pdpstub

  mfg-pipeline:
    image: provin-line/pipeline:local
    environment:
      CONFIG_FILE: /app/config/application.conf
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/mfg-pipeline/config:/app/config:ro
      - ./testdata/mfg-pipeline/data/keys:/app/data/keys:ro
      - ./testdata/manufacturer-account.seed:/app/secrets/manufacturer-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      mfg-network:
        condition: service_healthy
      nats:
        condition: service_started
      pdpstub:
        condition: service_started

  dist-network:
    image: provin-line/network:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/dist-network/config:/app/config:ro
      - ./testdata/distributor-account.seed:/app/secrets/distributor-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      # Order only (same as the pre-A3 all-in-one node's own cross-org
      # stagger) — distributor has no PRODUCT-level dependency on
      # manufacturer's network at boot, only at first resolution/relay time.
      - nats
      - pdpstub
      - mfg-network

  dist-pipeline:
    image: provin-line/pipeline:local
    environment:
      CONFIG_FILE: /app/config/application.conf
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/dist-pipeline/config:/app/config:ro
      - ./testdata/dist-pipeline/data/keys:/app/data/keys:ro
      - ./testdata/distributor-account.seed:/app/secrets/distributor-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      dist-network:
        condition: service_healthy
      nats:
        condition: service_started
      pdpstub:
        condition: service_started

  retail-network:
    image: provin-line/network:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/retail-network/config:/app/config:ro
      - ./testdata/retailer-account.seed:/app/secrets/retailer-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      - nats
      - pdpstub
      - dist-network

  retail-pipeline:
    image: provin-line/pipeline:local
    environment:
      CONFIG_FILE: /app/config/application.conf
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/retail-pipeline/config:/app/config:ro
      - ./testdata/retail-pipeline/data/keys:/app/data/keys:ro
      - ./testdata/retailer-account.seed:/app/secrets/retailer-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      retail-network:
        condition: service_healthy
      nats:
        condition: service_started
      pdpstub:
        condition: service_started
