# Scenario auditsurvival — compose-runtime topology (the twin of
# auditsurvival_test.go's process runtime: one NATS broker, one allow-all PDP
# stub, one acme node running a source loop and an observing sink; the test
# restarts the acme service mid-story — docker compose restart keeps the
# container filesystem, so file-backed control-plane state survives while
# in-memory evidence is lost, matching the process runtime's reused data dir).
#
# Provisioning artifacts under ./testdata are generated by the test itself
# (E2E_RUNTIME=compose go test ./scenarios/auditsurvival/) via
# harness.ProvisionCompose; images come from `make docker-build`. Host ports
# are published ephemerally and discovered with `docker compose port`.

services:
  nats:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222"
      - "8222"
    volumes:
      - ./testdata/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./testdata/nats/operator.jwt:/etc/nats/operator.jwt:ro

  pdpstub:
    image: provin-line/pdpstub:local
    # Reached only by nodes over the compose network; no published port.

  acme:
    image: provin-line/standalone:local
    # depends_on orders start only; the node dials NATS at boot and fails
    # closed if the broker is not accepting yet — the orchestrator restart is
    # the deployment-realistic recovery.
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/acme/config:/app/config:ro
      - ./testdata/acme-account.seed:/app/secrets/acme-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    depends_on:
      - nats
      - pdpstub
