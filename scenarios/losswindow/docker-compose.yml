# Scenario losswindow — compose-runtime topology (the twin of
# losswindow_test.go's process runtime: one broker, one PDP stub, TWO
# organizations — manufacturer producer and retailer sink — each split into
# its own cmd/network (control plane) + cmd/pipeline (data plane) pair, with
# one NATS grant (mfg -> retail on the lot pipeline subject) provisioned
# BEFORE broker boot).
#
# Why this twin is worth its weight (E2E-F-028, the finding it closes): the
# scenario's second half asserts that the producer's emission log survives a
# restart and that the next emission continues the sequence space. Those two
# properties straddle the control/data-plane boundary — cmd/pipeline holds the
# tlog locally and ships segments to cmd/network, which serves the checkpoint
# from its MIRRORED copy — so under compose they cross a container boundary
# the process runtime never exercises. The "loss-window mechanics are
# runtime-independent" reasoning that deferred this file only ever covered the
# FIRST half (subprocess stop/start of the consumer).
#
# retail deliberately carries a dedicated node pipeline/process pair despite
# running only a sink loop: cmd/pipeline's own wireauth-signed
# RegisterAuditHead fires for every consumed head, a sink's included, and is a
# boot preflight once there is a wire boundary to cross (the same reason
# supplychain's retailer and this scenario's process path both do it).
#
# Every node service carries `restart: on-failure`, retail included. The
# consumer's outage window does NOT need the policy removed: Docker marks a
# container stopped by an explicit `docker compose stop` as manually stopped and
# exempts it from the restart policy, so the policy was never what could end the
# outage early. Removing it would only cost coverage — retail-pipeline dials NATS
# and the registry at boot and fails closed, and E2E-F-020 is exactly the finding
# that bought self-healing for that race (`depends_on` orders start only, and
# retail-pipeline's NATS ordering is otherwise just the transitive delay of
# retail-network's healthcheck). Without the policy a transient trip leaves the
# container dead and startRetail's health wait hard-fails after 60s.
#
# Provisioning artifacts under ./testdata are generated by the test itself
# (E2E_RUNTIME=compose go test ./scenarios/losswindow/) via
# harness.ProvisionCompose + harness.SplitNodeConfig; images come from
# `make docker-build`.

services:
  nats:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222"
      - "8222"
    volumes:
      - ./testdata/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./testdata/nats/operator.jwt:/etc/nats/operator.jwt:ro

  pdpstub:
    image: provin-line/pdpstub:local
    # Reached only by nodes over the compose network; no published port.

  mfg-network:
    image: provin-line/network:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/mfg-network/config:/app/config:ro
      - ./testdata/mfg-account.seed:/app/secrets/mfg-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      - nats
      - pdpstub

  mfg-pipeline:
    image: provin-line/pipeline:local
    environment:
      CONFIG_FILE: /app/config/application.conf
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/mfg-pipeline/config:/app/config:ro
      - ./testdata/mfg-pipeline/data/keys:/app/data/keys:ro
      - ./testdata/mfg-account.seed:/app/secrets/mfg-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      mfg-network:
        condition: service_healthy
      nats:
        condition: service_started
      pdpstub:
        condition: service_started

  retail-network:
    image: provin-line/network:local
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/retail-network/config:/app/config:ro
      - ./testdata/retail-account.seed:/app/secrets/retail-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      # Order only — retail has no product-level dependency on mfg's network at
      # boot, only at first resolution time (supplychain's cross-org stagger).
      - nats
      - pdpstub
      - mfg-network

  retail-pipeline:
    image: provin-line/pipeline:local
    environment:
      CONFIG_FILE: /app/config/application.conf
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/retail-pipeline/config:/app/config:ro
      - ./testdata/retail-pipeline/data/keys:/app/data/keys:ro
      - ./testdata/retail-account.seed:/app/secrets/retail-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      retail-network:
        condition: service_healthy
      nats:
        condition: service_started
      pdpstub:
        condition: service_started
