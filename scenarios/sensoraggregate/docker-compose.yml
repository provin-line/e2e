# Scenario sensoraggregate — compose-runtime topology (the twin of sensoraggregate_test.go's
# process runtime: one NATS broker, one allow-all PDP stub, one plant node
# running the scenario's loops).
# A3: the node is split into cmd/network (control plane) + cmd/pipeline
# (data plane), mirroring the process runtime's own separated topology
# exactly (SplitNodeConfig; AGENTS.md rule 3 — both runtimes describe the
# same node/config layout).
#
# Provisioning artifacts under ./testdata are generated by the test itself
# (E2E_RUNTIME=compose go test ./scenarios/sensoraggregate/) via harness.ProvisionCompose + harness.SplitNodeConfig;
# images come from `make docker-build`. Host ports are published ephemerally and
# discovered with `docker compose port`.

services:
  nats:
    image: nats:2.10
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222"
      - "8222"
    volumes:
      - ./testdata/nats/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./testdata/nats/operator.jwt:/etc/nats/operator.jwt:ro

  pdpstub:
    image: provin-line/pdpstub:local
    # Reached only by nodes over the compose network; no published port.

  plant-network:
    image: provin-line/network:local
    # depends_on orders start only for nats/pdpstub; the node dials NATS at
    # boot and fails closed if the broker is not accepting yet — the
    # orchestrator restart is the deployment-realistic recovery.
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/plant-network/config:/app/config:ro
      - ./testdata/plant-account.seed:/app/secrets/plant-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      - nats
      - pdpstub

  plant-pipeline:
    image: provin-line/pipeline:local
    # cmd/pipeline's CONFIG_FILE convention (its Dockerfile's doc) — unlike
    # cmd/network's ./config/application.conf + CONFIG_OVERLAY layering, this
    # binary has no default config location.
    environment:
      CONFIG_FILE: /app/config/application.conf
    restart: on-failure
    ports:
      - "8443"
    volumes:
      - ./testdata/plant-pipeline/config:/app/config:ro
      # The pipeline's own local keystore (external-key provisioning, D9
      # keystore locality — ProvisionPipelineKey's doc): read-only because
      # cmd/pipeline only ever Signs with these keys, never writes new ones
      # at runtime.
      - ./testdata/plant-pipeline/data/keys:/app/data/keys:ro
      - ./testdata/plant-account.seed:/app/secrets/plant-account.seed:ro
      - ./testdata/operator.seed:/app/secrets/operator.seed:ro
      - ./testdata/jwts:/app/jwts
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:8443/readyz"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
    depends_on:
      plant-network:
        condition: service_healthy
      nats:
        condition: service_started
      pdpstub:
        condition: service_started
