# Scenario simple — compose-runtime topology (parity with simple_test.go's
# process runtime: one NATS broker, one allow-all PDP stub, one acme node
# running source→chained→sink loops).
#
# STATUS: authored for parity; compose-runtime execution is pending — the
# provisioning artifacts under testdata/ (operator/account seeds, account JWTs,
# nats-server.conf, application.conf) are generated by a future `make provision`
# step mirroring internal/harness provisioning. The process runtime
# (simple_test.go) is the reference execution today.

services:
  nats:
    image: nats:latest
    command: ["-c", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - ./testdata/nats-server.conf:/etc/nats/nats-server.conf:ro
      - ./testdata/jwts:/data/jwts:ro

  pdpstub:
    image: provin-line/pdpstub:local
    ports:
      - "9091:9091"

  acme:
    image: provin-line/standalone:local
    ports:
      - "18443:8443"
    volumes:
      - ./testdata/acme/config:/app/config:ro
      - ./testdata/acme/secrets:/app/secrets:ro
      - ./testdata/jwts:/app/jwts
    depends_on:
      - nats
      - pdpstub
